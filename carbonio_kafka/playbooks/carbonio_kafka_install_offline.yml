---
- name: Confirm Carbonio Kafka HA setup
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/confirm_ha_setup
    
- name: Prepare Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/prepare_ansible_controller
    
- name: Validate Kafka installation prerequisites
  hosts: all
  order: inventory
  gather_facts: true
  roles:
     - ../roles/pre_installation_checks

- name: Install and configure Kafka
  hosts: kafka
  order: inventory
  gather_facts: true
  vars:
      offline: true
  roles:
     - ../roles/install_kafka

- name: Configure Kafka brokers on Application Servers
  hosts: applicationServers
  order: inventory
  gather_facts: true
  roles:
     - ../roles/configure_kafka_mailbox