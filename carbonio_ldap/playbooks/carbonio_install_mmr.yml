---
- name: Confirm Carbonio LDAP HA setup
  hosts: masterDirectoryServers
  order: inventory
  gather_facts: true
  any_errors_fatal: true
  roles:
    - ../roles/confirm_ha_setup
    
- name: Prepare Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/prepare_ansible_controller

- name: Validate LDAP Multi-Master installation prerequisites
  hosts: all
  order: inventory
  gather_facts: true
  roles:
     - ../roles/pre_installation_checks

- name: Install and configure LDAP Multi-Master
  hosts: masterDirectoryServers
  order: inventory
  gather_facts: true
  roles:
     - ../roles/install_multimaster