---
- name: Prepare Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/prepare_ansible_controller
    
- name: Validate LDAP Multi-Master installation prerequisites
  hosts: all
  order: inventory
  gather_facts: yes
  roles:
     - ../roles/pre_installation_checks
     
- name: Promote and configure LDAP Multi-Master
  hosts: masterDirectoryServers
  order: inventory
  gather_facts: yes
  roles:
     - ../roles/promote_multimaster