---
- name: Check if read replica configured
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - execute-pending-setups

- name: Stop carbonio services on second LDAP master
  become: true
  become_method: su
  become_user: zextras
  ansible.builtin.command: "/opt/zextras/bin/zmcontrol stop"
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - ansible_facts.distribution_major_version != "9"
    - ansible_facts.distribution_major_version != "24"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Stop carbonio on second LDAP master [Sysd]
  become: true
  ansible.builtin.systemd_service:
    name: carbonio.target
    state: stopped
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - ansible_facts.distribution_major_version == "9" or ansible_facts.distribution_major_version == "24"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Install Carbonio directory server [Ubuntu]
  become: true
  ansible.builtin.apt:
    name: carbonio-directory-server
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Install Carbonio directory server [RHEL]
  become: true
  ansible.builtin.yum:
    name: carbonio-directory-server
    state: present
  when:
    - ansible_facts.os_family == "RedHat"
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Remove old configuration
  become: true
  ansible.builtin.shell: "rm -f /opt/zextras/config.* /opt/zextras/.install_history"
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Manage Consul password
  ansible.builtin.set_fact:
    carbonio_mesh_password: "{{ lookup('ansible.builtin.password', inventory_file + '_consulpassword', chars=['ascii_letters', 'digits'], length=8) }}"
  tags:
    - execute-pending-setups

- name: Copy scripts to remote host
  become: true
  ansible.builtin.template:
    src: apply-pending-setups.sh.j2
    dest: /tmp/apply-pending-setups.sh
    mode: "0755"
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-pending-setups

- name: Run Carbonio pending-setups
  become: true
  ansible.builtin.command: /tmp/apply-pending-setups.sh {{ carbonio_mesh_password }}
  register: pso
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-pending-setups

- name: Remove pending setups script
  become: true
  ansible.builtin.file:
    path: /tmp/apply-pending-setups.sh
    state: absent
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-pending-setups

- name: Manage ldap password
  ansible.builtin.set_fact:
    carbonio_ldap_password: "{{ lookup('ansible.builtin.password', inventory_file + '_ldap_password', chars=['ascii_letters', 'digits'], length=8) }}"
  tags:
    - execute-carbonio-bootstrap

- name: Create config file
  ansible.builtin.template:
    src: carbonio-config.txt.j2
    dest: /tmp/carbonio-config.txt
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-carbonio-bootstrap

- name: Wait 10 seconds for LDAP services to stabilize
  ansible.builtin.pause:
    seconds: 10

- name: Run Carbonio Bootstrap
  become: true
  ansible.builtin.command: /usr/bin/carbonio-bootstrap -c /tmp/carbonio-config.txt
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-carbonio-bootstrap

- name: Change local conf on second master
  become: true
  become_method: su
  become_user: zextras
  ansible.builtin.command: "/opt/zextras/bin/zmlocalconfig -e ldap_master_url=\"ldap://{{ groups['masterDirectoryServers'][1] }}:389 ldap://{{ groups['masterDirectoryServers'][0] }}:389\""
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Restart carbonio on second LDAP master
  become: true
  become_method: su
  become_user: zextras
  ansible.builtin.command: "/opt/zextras/bin/zmcontrol restart"
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - ansible_facts.distribution_major_version != "9"
    - ansible_facts.distribution_major_version != "24"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Restart carbonio on second LDAP master [Sysd]
  become: true
  ansible.builtin.systemd_service:
    name: carbonio.target
    state: restarted
  when:
    - "'carbonio-directory-server' not in ansible_facts.packages"
    - ansible_facts.distribution_major_version == "9" or ansible_facts.distribution_major_version == "24"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"