---
- name: Install Carbonio license service [Ubuntu]
  become: true
  ansible.builtin.apt:
    name: carbonio-license-service
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Install Carbonio license service [RHEL]
  become: true
  ansible.builtin.yum:
    name: carbonio-license-service
    state: present
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"

- name: Run pending setups for license service
  become: true
  ansible.builtin.command: /tmp/apply-pending-setups.sh {{ carbonio_mesh_password }}
  register: license_service_pso
  when:
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-pending-setups

- name: Remove scripts from remote host
  become: true
  ansible.builtin.file:
    state: absent
    path: /tmp/apply-pending-setups.sh
  when:
    - inventory_hostname in groups["masterDirectoryServers"]
    - ldap_role == "mmr"
  tags:
    - execute-pending-setups