---
- name: Prepare Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/prepare_ansible_controller

- name: Validate Patroni installation prerequisites
  hosts: all
  order: inventory
  gather_facts: yes
  roles:
     - ../roles/pre_installation_checks
     
- name: Install and configure Patroni
  hosts: postgresServers
  order: inventory
  gather_facts: yes
  roles:
     - ../roles/install_patroni

- name: Install HAProxy for infrastructures with Multi-Master LDAP
  hosts: all
  gather_facts: yes
  tasks:
    - name: HAProxy installation for infrastructures with Multi Master LDAP
      ansible.builtin.import_role:
        name: ../roles/install_haproxy
      when: groups['masterDirectoryServers'] | length > 1
      tags:
        - haproxy

- name: Install HAProxy for infrastructures without Multi-Master LDAP
  hosts: dbsConnectorServers
  gather_facts: yes
  tasks:
    - name: HAProxy installation for infrastructures without Multi Master LDAP
      ansible.builtin.import_role:
        name: ../roles/install_haproxy
      when: groups['masterDirectoryServers'] | length == 1
      tags:
        - haproxy

- name: Move DB connectors 
  hosts: all
  gather_facts: yes
  tasks:
    - name: Move DB connectors for full HA
      ansible.builtin.import_role:
        name: ../roles/move_dbconnectors
      tags:
        - move-dbconnectors