---
- name: Prepare Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ../roles/prepare_ansible_controller

- name: Validate PostgreSQL replica installation prerequisites
  hosts: all
  order: inventory
  gather_facts: true
  roles:
     - ../roles/pre_installation_checks
     
- name: Install and configure PostgreSQL replicas
  hosts: postgresServers
  order: inventory
  gather_facts: true
  roles:
     - ../roles/install_replica_postgres