---
- name: Update repositories [Ubuntu]
  become: true
  ansible.builtin.shell: "apt update"
  register: update_result
  when:
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Store configured Zextras repository output [Ubuntu]
  ansible.builtin.set_fact:
    carbonio_repository_output: "{{ ((update_result.stdout_lines | default([])) + (update_result.stderr_lines | default([]))) | select('search', '(?i)zextras') | list }}"
  when:
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Store Carbonio repository information [Ubuntu]
  ansible.builtin.set_fact:
    carbonio_repository_preconfigured: "{{ carbonio_repository_output | length > 0 }}"
    carbonio_repository_urls: "{{ carbonio_repository_output | join(' ') | regex_findall('(?:Hit|Get|Ign|Err):\\d+\\s+(https?://\\S+)') | map('regex_replace', '/$', '') | unique | list }}"
  when:
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Update repositories [RHEL]
  become: true
  ansible.builtin.yum:
    update_cache: true
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Retrieve configured repositories [RHEL]
  ansible.builtin.shell: "dnf repolist -v"
  register: update_result_rhel
  changed_when: false
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Store configured Zextras repository output [RHEL]
  ansible.builtin.set_fact:
    carbonio_repository_output: "{{ ((update_result_rhel.stdout_lines | default([])) + (update_result_rhel.stderr_lines | default([]))) | select('search', '(?i)zextras') | list }}"
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Store Carbonio repository information [RHEL]
  ansible.builtin.set_fact:
    carbonio_repository_preconfigured: "{{ carbonio_repository_output | length > 0 }}"
    carbonio_repository_urls: "{{ carbonio_repository_output | join(' ') | regex_findall('https?://\\S+') | map('regex_replace', '/$', '') | unique | list }}"
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in carbonio_repository_check_hosts

- name: Abort when Zextras repository is not configured
  ansible.builtin.fail:
    msg: >-
      No Zextras repository is configured on
      {{ inventory_hostname }}. Configure the repository
      before running the Carbonio Patroni HA setup.
  when:
    - inventory_hostname in carbonio_repository_check_hosts
    - not carbonio_repository_preconfigured

- name: Abort when configured Carbonio repository URL cannot be determined
  ansible.builtin.fail:
    msg: >-
      A configured Zextras repository was detected on
      {{ inventory_hostname }}, but its URL could not be determined:
      {{ carbonio_repository_output | join(', ') }}
  when:
    - inventory_hostname in carbonio_repository_check_hosts
    - carbonio_repository_preconfigured
    - carbonio_repository_urls | length == 0

- name: Abort when multiple Carbonio repositories are configured
  ansible.builtin.fail:
    msg: >-
      Multiple Carbonio repositories are configured on
      {{ inventory_hostname }}:
      {{ carbonio_repository_urls | join(', ') }}
  when:
    - inventory_hostname in carbonio_repository_check_hosts
    - carbonio_repository_urls | length > 1

- name: Determine Carbonio repository to use
  ansible.builtin.set_fact:
    carbonio_repository_url: "{{ carbonio_repository_urls | first }}"
  when:
    - inventory_hostname in carbonio_repository_check_hosts

- name: Collect Carbonio repositories
  ansible.builtin.set_fact:
    carbonio_repositories: "{{ carbonio_repository_check_hosts | map('extract', hostvars, 'carbonio_repository_url') | unique | list }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: Abort when different Carbonio repositories are configured
  ansible.builtin.fail:
    msg: |
      Different Carbonio repositories were detected across the
      current and target DB connector servers:

      {% for host in carbonio_repository_check_hosts %}
      {{ host }}: {{ hostvars[host].carbonio_repository_url }}
      {% endfor %}

      Configure the same Carbonio repository on all DB connector servers
      before continuing.
  run_once: true
  when:
    - hostvars['localhost'].carbonio_repositories | length > 1