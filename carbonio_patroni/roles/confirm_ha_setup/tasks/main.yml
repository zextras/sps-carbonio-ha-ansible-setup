---
- ansible.builtin.import_tasks: check_playbook_metadata.yml
- ansible.builtin.import_tasks: check_carbonio_version.yml

- ansible.builtin.import_tasks: check_carbonio_repositories.yml
  when:
    - carbonio_repository_check_hosts is defined
    - carbonio_repository_check_hosts | length > 0

- ansible.builtin.import_tasks: confirm_repository_and_playbook.yml