---
- name: Install Postgres [Ubuntu]
  become: true
  ansible.builtin.apt: name={{ item }} state=present
  with_items:
    - "{{ postgres_packages_ubuntu }}"  
  when: 
    - ansible_facts.os_family == "Debian"
    - inventory_hostname in groups['postgresServers']
    - patroni_role == "secondary"
  tags:
    - install-postgres

- name: Install PostgreSQL [RHEL]
  become: true
  ansible.builtin.yum: name={{ item }} state=present
  with_items:
    - "{{ postgres_packages_rhel }}"  
  when:
    - ansible_facts.os_family == "RedHat"
    - inventory_hostname in groups['postgresServers']
    - patroni_role == "secondary" 
  tags:
    - install-postgres