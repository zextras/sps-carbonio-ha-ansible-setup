---
- name: Ensure apt keyrings directory exists on Ubuntu
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
    - set-repos

- name: Download PostgreSQL repository key on Ubuntu
  become: true
  ansible.builtin.get_url:
    url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
    - set-repos

- name: Create Postgres repo on Ubuntu
  become: true
  ansible.builtin.template:
    src: postgresql.list.j2
    dest: /etc/apt/sources.list.d/pgdg.list
    mode: "0644"
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
    - set-repos

- name: Update repos
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts.os_family == "Debian" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
    - set-repos
      
############ RHEL        
- name: Enable RHEL Postgres repository
  become: true
  ansible.builtin.yum:
    name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_facts.distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
    disable_gpg_check : true
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
      - set-repos

- name: Add zextras release repo(RedHat)
  ansible.builtin.yum_repository:
    name: zextras
    description: Zextras Carbonio Release for RHEL {{ ansible_facts.distribution_major_version }} x86_64 (RPMs)
    ansible.builtin.file: zextras
    baseurl: https://repo.zextras.io/release/rhel{{ ansible_facts.distribution_major_version }}/
    gpgkey: https://repo.zextras.io/repomd.xml.key
    gpgcheck: no
    repo_gpgcheck: no
    enabled: true
  when: ansible_facts['os_family'] == "RedHat" and  inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
    - set-repos

- name: Update RedHat repo(RedHat)
  become: true
  ansible.builtin.shell:
    cmd: "yum check-update -y 2>/dev/null"
    executable: /bin/bash
  register: pkgu
  failed_when: "pkgu.rc not in [ 0, 100 ]"
  when: ansible_facts.os_family == "RedHat" and  inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
    - set-repos

- name: Disable the postgresql stream module in AppStream
  become: true
  ansible.builtin.command: '/usr/bin/dnf -qy module disable postgresql'
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
      - set-repos
      
- name: Enable Epel repo
  become: true
  ansible.builtin.yum:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts.distribution_major_version }}.noarch.rpm
    state: present
  when: ansible_facts.os_family == "RedHat" and inventory_hostname in groups["postgresServers"] and patroni_role == "secondary"
  tags:
      - set-repos    